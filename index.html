    <title>Build a Social links Profile</title>
    <link

        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #141414;
        }

        body {
            margin-inline: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-width: 600px;

        }

        .card {
            margin-block: 30px#7f9146;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 5px;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        img {
            margin-inline: auto;
            padding: auto;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            text-align: center;

        }

        h1 {
            font-family: "Roboto", sans-serif;
            padding: 10px;
            color: #b5b5b5;
            font-size: 24px;
        }

        .area {
            font-family: "Red Hat Display", sans-serif;
            color: #7f9146;
            padding: 10px;
            font-size: 12px;
            font-family: "Roboto", sans-serif;
            font-weight: 700;
        }

        .about {

            color: #b8b8b8;
            padding: 10px;
            font-size: 12px;
            font-family: "Roboto", sans-serif;
            font-weight: 400;
        }

        a {
            color: #d0d0d0;
            text-decoration: none;
            background-color: #333333;
            color: #d0d0d0;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            display: inline-block;
            margin-top: 10px;

            :hover {
                background-color: #555555;
            }
        }
    </style>
</head>
